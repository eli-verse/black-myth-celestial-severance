<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Myth: Celestial Severance</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23d4af37'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07070a;
        color: #f4efe6;
        font-family: 'Palatino Linotype', 'Book Antiqua', 'Georgia', serif;
      }

      [hidden] {
        display: none !important;
      }

      #game-root {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #07070a;
      }

      #game-root > canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #m1-status-overlay {
        position: fixed;
        top: 16px;
        left: 20px;
        z-index: 40;
        pointer-events: none;
        padding: 8px 14px;
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 4px;
        background: rgba(10, 10, 15, 0.72);
        color: #e8d5a3;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #m1-status-overlay.is-hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="m1-status-overlay" role="status" aria-live="polite">
      Loading Temple Assets...
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
